<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mega Quiz 3.0</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #1e1e2f, #0f0f1b);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }

    .card {
      background: #282a36;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      width: 100%;
      max-width: 500px;
      text-align: center;
    }

    h1 {
      font-size: 26px;
      margin-bottom: 20px;
      color: #50fa7b;
    }

    .form-group {
      margin-bottom: 15px;
      text-align: left;
    }

    label {
      font-size: 14px;
      color: #bd93f9;
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }

    select {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      background: #44475a;
      color: #fff;
      font-size: 16px;
      outline: none;
    }

    button {
      width: 100%;
      padding: 14px;
      background: #ff79c6;
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      margin-top: 10px;
    }

    button:hover {
      background: #ff92d0;
    }

    button:active {
      transform: scale(0.98);
    }

    .timer-container {
      width: 100%;
      background: #44475a;
      height: 10px;
      border-radius: 5px;
      margin: 15px 0;
      overflow: hidden;
    }

    .timer-bar {
      height: 100%;
      width: 100%;
      background: #ff5555;
      transition: width 1s linear;
    }

    .stats {
      display: flex;
      justify-content: space-between;
      margin-bottom: 15px;
      font-size: 14px;
      color: #f1fa8c;
      font-weight: bold;
    }

    .question-text {
      font-size: 18px;
      margin-bottom: 20px;
      line-height: 1.4;
      min-height: 50px;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .opt-btn {
      background: #44475a;
      color: #fff;
      padding: 12px;
      border-radius: 8px;
      border: 2px solid transparent;
      font-size: 16px;
      text-align: left;
      cursor: pointer;
    }

    .opt-btn.correct {
      background: #50fa7b !important;
      color: #282a36 !important;
      font-weight: bold;
    }

    .opt-btn.wrong {
      background: #ff5555 !important;
      color: #fff !important;
    }

    .hidden {
      display: none;
    }

    .score-title {
      font-size: 28px;
      color: #f1fa8c;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

  <!-- TELA INICIAL -->
  <div class="card" id="setup-card">

    <div class="form-group">
      <label>Categoria:</label>
      <select id="category-select">
        <option value="futebol">⚽ Futebol</option>
        <option value="geral">🧠 Conhecimentos Gerais</option>
        <option value="marvel">🦸‍♂️ Marvel</option>
        <option value="dc">🦇 DC Comics</option>
        <option value="todas">🔀 Todas (Misturado)</option>
      </select>
    </div>

    <div class="form-group">
      <label>Dificuldade:</label>
      <select id="difficulty-select">
        <option value="facil">Fácil</option>
        <option value="medio">Médio</option>
        <option value="dificil">Difícil</option>
        <option value="misto">Misto (Todas as dificuldades)</option>
      </select>
    </div>

    <div class="form-group">
      <label>Quantidade de Perguntas:</label>
      <select id="count-select">
        <option value="5">5 Perguntas</option>
        <option value="10">10 Perguntas</option>
        <option value="20">20 Perguntas</option>
        <option value="30">30 Perguntas</option>
        <option value="40">40 Perguntas</option>
        <option value="50">50 Perguntas</option>
      </select>
    </div>

    <button onclick="iniciarJogo()">Começar Jogo</button>
  </div>

  <!-- TELA DO JOGO -->
  <div class="card hidden" id="quiz-card">
    <div class="stats">
      <span id="progress-text">Pergunta 1/10</span>
      <span id="timer-text">⏱️ 15s</span>
    </div>

    <div class="timer-container">
      <div class="timer-bar" id="timer-bar"></div>
    </div>

    <div class="question-text" id="question-text">A carregar pergunta...</div>

    <div class="options-grid" id="options-container"></div>
  </div>
